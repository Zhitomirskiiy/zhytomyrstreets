<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вулиці Житомира</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: linear-gradient(135deg, #1e3a8a, #312e81);
      color: white;
      margin: 0;
      padding: 20px;
      transition: background 0.6s;
      background-size: cover !important;
      background-position: center !important;
      background-repeat: no-repeat !important;
      background-attachment: fixed;
      min-height: 100vh;
    }
    h1 { margin: 20px 0 15px; }
    #mode-selection { margin: 30px 0; }
    .main-photo {
      max-width: 750px; width: 100%; height: auto; object-fit: contain;
      border-radius: 20px; box-shadow: 0 8px 25px rgba(0,0,0,0.5); margin: 25px auto; display: block;
    }
    button {
      padding: 18px 35px;
      font-size: 19px;
      margin: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: bold;
    }
    .timer-btn { background: #f59e0b; color: black; }
    .unlimited-btn { background: #22c55e; color: black; }
    .music-btn, .ach-btn, .shop-btn {
      background: #8b5cf6; color: white; padding: 12px 20px; font-size: 17px; margin: 8px;
    }
    #coins { font-size: 24px; margin: 10px 0; font-weight: bold; }
    input {
      padding: 16px; font-size: 22px; width: 70%; max-width: 500px;
      border: none; border-radius: 12px; margin: 15px 0;
    }
    #timer { font-size: 48px; font-weight: bold; color: #f87171; margin: 15px 0; }
    .table-container {
      max-width: 900px; margin: 25px auto; max-height: 500px;
      overflow-y: auto; border: 2px solid rgba(255,255,255,0.2); border-radius: 12px;
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); text-align: left; }
    th { background: rgba(255,255,255,0.1); position: sticky; top: 0; }
    .found { color: #22c55e; font-weight: bold; background: rgba(34, 197, 94, 0.2); }
  </style>
</head>

  <h1>Назви якнайбільше вулиць Житомира</h1>
  
  <div id="mode-selection">
  <img src="photo1.jpg" class="main-photo" alt="Житомир">
  <p style="font-size: 22px; margin: 30px 0;">Обери режим гри:</p>
  <button class="timer-btn" id="btn30">30 хвилин</button>
  <button class="unlimited-btn" id="btnUnlimited">Безлімітний режим</button>
<button class="unlimited-btn" id="btnOldNames" style="background:#0ea5e9;">Режим: Старі назви</button>
</div>
	<button class="unlimited-btn" id="btnFigures" style="background:#a855f7; color:white;">На честь постатей</button>

  <div id="game" style="display: none;">
    <div id="timer"></div>
    <p id="score">Знайдено: <strong>0</strong> / <span id="total"></span></p>
    <p id="coins">Крошники: <img src="kroshnik.jpg" width="28" height="28" style="vertical-align:middle;"> <strong>0</strong></p>
    
    <button class="music-btn" id="musicBtn" onclick="toggleMusic()">Музика: Увімкнено</button>
    <button class="ach-btn" onclick="showAchievements()">🏆 Досягнення</button>
    <button class="shop-btn" onclick="showShop()">🛒 Магазин</button>

    <input type="text" id="input" placeholder="Введи назву вулиці..." autocomplete="off">
	<button id="skipBtn" onclick="skipOldName()" style="display:none; padding: 12px 24px; font-size: 17px; background:#ef4444; color:white; border:none; border-radius:12px; cursor:pointer; margin-left:10px;">

</button>

function checkAchievements() {
  const count = guessed.size;
	
  const authorStreets = [
	"Варганової Діни",
    "Глібко",
    "Героїв Політеха",
    "Героїв оборони атб",

    "Зіньковського",
    "Вікторії Нелипович",
    "Хамдоша Іскандера",
    "Наталії Венцель"
  ];

  const foundAuthor = authorStreets.filter(street => guessed.has(street)).length;

  achievements.forEach(ach => {
    if (unlockedAchievements.has(ach.id)) return;

    let unlocked = false;

    if (ach.type === "count" && count >= ach.target) unlocked = true;
    if (ach.type === "author" && foundAuthor >= ach.target) unlocked = true;
	if (ach.type === "old" && foundOldNames.size >= ach.target) unlocked = true;

    if (unlocked) {
      unlockedAchievements.add(ach.id);
      showAchievementPopup(ach);
      saveAchievements();
    }
  });
}

      const modal = document.createElement('div');
      modal.id = "achievements-modal";
      modal.style.cssText = `position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.92); z-index:10001; display:flex; align-items:center; justify-content:center;`;

      modal.innerHTML = `
        <div style="background:#1e3a8a; padding:25px; border-radius:16px; max-width:520px; max-height:90vh; overflow-y:auto; width:90%;">
          ${html}
          <button id="close-modal-btn" style="margin-top:20px; padding:14px 40px; font-size:18px; background:#22c55e; color:black; border:none; border-radius:12px; cursor:pointer; width:100%;">
            Закрити
          </button>
        </div>`;

      document.body.appendChild(modal);

      document.getElementById('close-modal-btn').addEventListener('click', () => modal.remove());
      
      modal.addEventListener('click', (e) => {
        if (e.target === modal) modal.remove();
      });
    }

function startGame(minutes) {
  document.getElementById('mode-selection').style.display = 'none';
  gameDiv.style.display = 'block';
  input.focus();
  if (minutes === 0) isUnlimited = true;
  else timeLeft = minutes * 60;
  startTime = Date.now();
  currentCombo = 0;
  mistakes = 0;
  initAchievements();
  loadAchievements();
  loadProgress();
  startTimer();
  input.addEventListener('input', checkStreet);
  playMusic();
}	

    function toggleMusic() {
      if (isMusicPlaying) {
        bgMusic.pause();
        musicBtn.textContent = "Музика: Вимкнено";
        musicBtn.style.background = "#ef4444";
      } else {
        bgMusic.play();
        musicBtn.textContent = "Музика: Увімкнено";
        musicBtn.style.background = "#8b5cf6";
      }
      isMusicPlaying = !isMusicPlaying;
    }

    function playMusic() {
      bgMusic.volume = 0.25;
      bgMusic.play().catch(() => {});
    }

    function updateTable() {
      tbody.innerHTML = '';
      totalEl.textContent = allStreets.length;
      guessed.forEach(street => {
        const tr = document.createElement('tr');
        tr.classList.add('found');
        tr.innerHTML = `<td>${street}</td>`;
        tbody.appendChild(tr);
      });
      scoreEl.textContent = guessed.size;
    }

  function checkStreet() {
  let value = input.value.trim().toLowerCase();
  if (!value) return;

  // прибираємо типи вулиць
  value = value.replace(/вулиця|вул\.?|пров\.?|шосе|проспект|майдан|узвіз/gi, '').trim();

  let found = null;
  let isOldName = false;

  // Спочатку перевіряємо сучасну назву
  found = allStreets.find(street => street.toLowerCase() === value);

  // Якщо не знайшли — перевіряємо старі назви
  if (!found && oldToNew[value]) {
    found = oldToNew[value];
    isOldName = true;
  }

  if (found && !guessed.has(found)) {
    guessed.add(found);
    
    if (isOldName) {
      foundOldNames.add(value); // зберігаємо стару назву
    }

    currentCombo++;
    addCoins(10);
    updateTable();
    checkAchievements();
    input.value = '';
  } else {
    currentCombo = 0;
    mistakes++;
  }
}
    function startTimer() {
      if (isUnlimited) {
        timerEl.textContent = "Безліміт";
        return;
      }
      timerInterval = setInterval(() => {
        timeLeft--;
        const hours = Math.floor(timeLeft / 3600);
        const minutes = Math.floor((timeLeft % 3600) / 60);
        const seconds = timeLeft % 60;
        timerEl.textContent = `${hours}:${minutes < 10 ? '0' : ''}${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          alert(`Час вийшов!\nТи назвав ${guessed.size} вулиць!`);
        }
      }, 1000);
    }

    function showShop() {
      const modal = document.createElement('div');
      modal.id = "shop-modal";
      modal.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);z-index:10001;display:flex;align-items:center;justify-content:center;`;

     modal.innerHTML = `
  <div style="background:#1e3a8a;padding:25px;border-radius:16px;max-width:520px;width:90%;">
    <h2>🛒 Магазин Крошників</h2>
    <p>У тебе: <img src="kroshnik.jpg" width="28" height="28" style="vertical-align:middle;"> <strong>${coins}</strong> Крошників</p>
    
    <div style="margin:12px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px; text-align:left;">
      <strong>Класичний фон</strong> — 0 
      <button onclick="buyBackground('default')" style="float:right;">Застосувати</button>

    <div style="margin:12px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px; text-align:left;">
      <strong>Фон 1</strong> — 150 
      <button onclick="buyBackground('фон1')" style="float:right;">Купити</button>
    </div>
    <div style="margin:12px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px; text-align:left;">
      <strong>Фон 2</strong> — 200 
      <button onclick="buyBackground('фон2')" style="float:right;">Купити</button>
    </div>
    <div style="margin:12px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px; text-align:left;">
      <strong>Фон 3</strong> — 220 
      <button onclick="buyBackground('фон3')" style="float:right;">Купити</button>
    </div>
    <div style="margin:12px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px; text-align:left;">
      <strong>Фон 4</strong> — 250 
      <button onclick="buyBackground('фон4')" style="float:right;">Купити</button>
    </div>
	<div style="margin:12px 0; padding:15px; background:rgba(255,255,255,0.1); border-radius:12px; text-align:left;">
  <strong>???</strong> — 500
  <button onclick="buyBackground('фон5')" style="float:right;">Купити</button>
</div>

    <button onclick="closeShop()" style="margin-top:20px;padding:14px 40px;background:#22c55e;color:black;border:none;border-radius:12px;cursor:pointer;width:100%;">Закрити</button>
  </div>`;
      document.body.appendChild(modal);
    }

    function closeShop() {
      const modal = document.getElementById('shop-modal');
      if (modal) modal.remove();
    }

   window.buyBackground = function(bg) {
  let imageUrl = "";
  let price = 0;

  if (bg === "фон1") { imageUrl = "url('фон1.jpg')"; price = 150; }
  else if (bg === "фон2") { imageUrl = "url('Фон2.jpg')"; price = 200; }
  else if (bg === "фон3") { imageUrl = "url('Фон3.jpg')"; price = 220; }
  else if (bg === "фон4") { imageUrl = "url('Фон4.jpg')"; price = 250; }
  else if (bg === "фон5") { imageUrl = "url('фон5.jpg')"; price = 500; } 
  else if (bg === "default") {
    document.body.style.background = "linear-gradient(135deg, #1e3a8a, #312e81)";
    alert("✅ Класичний фон застосовано!");
    saveProgress();
    return;
  }

  if (coins >= price) {
    coins -= price;
    document.body.style.background = imageUrl;
    document.body.style.backgroundSize = "cover";
    document.body.style.backgroundPosition = "center";
    document.body.style.backgroundRepeat = "no-repeat";
    document.body.style.backgroundAttachment = "fixed";
    coinsEl.innerHTML = `Крошники: <img src="kroshnik.jpg" width="28" height="28" style="vertical-align:middle;"> <strong>${coins}</strong>`;
    alert("✅ Фон " + bg + " успішно змінено!");
  } else {
    alert("Недостатньо Крошників!");
  }
  saveProgress();
};
	  
	function startOldNamesMode() {
  isOldNamesMode = true;
  document.getElementById('mode-selection').style.display = 'none';
  gameDiv.style.display = 'block';
document.getElementById('skipBtn').style.display = 'inline-block';
  
  // document.getElementById('timer').style.display = 'none';  ← прибери або закоментуй цей рядок
  
  oldNamesList = Object.values(oldToNew);
  
  showNextOldName();
  
  input.focus();
  input.addEventListener('input', checkOldName);
  playMusic();
}
	  
function showNextOldName() {
  if (oldNamesList.length === 0) {
    alert(`Ти назвав усі старі назви!\nЗнайдено: ${guessed.size}`);
    return;
  }
 
  const randomIndex = Math.floor(Math.random() * oldNamesList.length);
  currentModernName = oldNamesList[randomIndex];
 
  timerEl.textContent = currentModernName;
 timerEl.style.color = "#000000";
timerEl.style.background = "#ffffff";
timerEl.style.padding = "12px 24px";
timerEl.style.borderRadius = "12px";
timerEl.style.fontSize = "32px";
timerEl.style.display = "inline-block";
}

function checkOldName() {
  let value = input.value.trim().toLowerCase();
  if (!value) return;

  const correctOld = Object.keys(oldToNew).find(key => oldToNew[key] === currentModernName);

  if (value === correctOld) {
    guessed.add(currentModernName);
    foundOldNames.add(correctOld);
    addCoins(15);
    updateTable();
   
    oldNamesList = oldNamesList.filter(name => name !== currentModernName);
   
    input.value = '';
    showNextOldName();
  }
}
function skipOldName() {
  if (!currentModernName) return;

  oldNamesList = oldNamesList.filter(name => name !== currentModernName);
  input.value = '';
  showNextOldName();
}

document.getElementById('btn30').addEventListener('click', function() {
  startGame(30);
});

document.getElementById('btnUnlimited').addEventListener('click', function() {
  startGame(0);
});

document.getElementById('btnOldNames').addEventListener('click', function() {
  startOldNamesMode();
});

	  document.getElementById('btnFigures').addEventListener('click', function() {
  startFiguresMode();
});

function startFiguresMode() {
  document.getElementById('mode-selection').style.display = 'none';
  gameDiv.style.display = 'block';
  input.focus();

  const skipBtn = document.getElementById('skipBtn');
  if (skipBtn) skipBtn.style.display = 'none';

  guessed = new Set();
  currentCombo = 0;
  mistakes = 0;

  totalEl.textContent = figureStreets.length;
  updateTable();

  input.removeEventListener('input', checkStreet);
  input.removeEventListener('input', checkOldName);
  input.addEventListener('input', checkFiguresStreet);

  playMusic();
}

function checkFiguresStreet() {
  let value = input.value.trim().toLowerCase();
  if (!value) return;

  value = value.replace(/вулиця|вул\.?|пров\.?|шосе|проспект|майдан|узвіз/gi, '').trim();

  const found = figureStreets.find(street => street.toLowerCase() === value);

  if (found && !guessed.has(found)) {
    guessed.add(found);
    currentCombo++;
    addCoins(10);
    updateTable();
    checkAchievements();
    input.value = '';
  } else {
    currentCombo = 0;
    mistakes++;
  }
}

loadProgress();
